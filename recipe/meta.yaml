{% set name = "bookstore" %}
{% set version = "2.5.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b37324cfd3ea9622c5bd4d53b9698c897d2306f884b6ac4ebf33945120cf1c78
build:
  number: 1
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - future
    - ipython >=5.0
    - notebook
    - tornado >=5.1.1
    - aiobotocore

test:
  requires:
    - python {{ python_min }}
  imports:
    - bookstore

about:
  home: http://github.com/nteract/bookstore
  license: BSD
  license_family: BSD
  license_file: LICENSE
  summary: 'Storage Workflows for Notebooks'
  description: |
    bookstore provides tooling and workflow recommendations for storing,
    scheduling, and publishing notebooks.
  doc_url: http://bookstore.readthedocs.io/
  dev_url: https://github.com/nteract/bookstore

extra:
  recipe-maintainers:
    - MSeal
    - mpacer
    - willingc
    - rgbkrk
    - captainsafia
